services:
  pygeoapi:
    build: ./api
    container_name: pygeoapi_with_scheduler
    ports:
      - "8080:8000"
    environment:
      PYTHONPATH: /qgis_processing_api:/qgis_processing_api/pygeoapi/plugins
      # Gestion des utilisateurs (X-Forwarded-User / X-User-Groups
      # injectés par Traefik). Passer à "false" pour désactiver
      # entièrement l'authentification (pas de 401, owner vide partout).
      AUTH_ENABLED: "true"
      # Algorithmes publiés comme process OGC (/processes/native:buffer...),
      # motifs fnmatch séparés par des virgules. Chaque algorithme coûte un
      # `qgis_process help` au premier démarrage (~secondes), d'où une liste
      # restreinte ; "native:*,model:*,script:*" publie tout (cf. README).
      QGIS_PUBLISHED_ALGORITHMS: "native:buffer,native:reprojectlayer,model:*,script:*"
      # Redémarrage planifié pour prendre en compte les modèles/scripts
      # ajoutés, modifiés ou supprimés : expression cron (5 champs). À cette
      # heure, l'application ne redémarre que si quelque chose a changé ;
      # sans cette variable, jamais de redémarrage automatique.
      # QGIS_RESTART_CRON: "0 3 * * *"
      # QGIS_RESTART_TIMEZONE: "Europe/Paris"
      # Attente maximale (secondes) des jobs en cours avant de les annuler
      # (motif : redémarrage). Défaut : 1800.
      # QGIS_RESTART_DRAIN_TIMEOUT: "1800"
      # ADMIN_USERS: "alice,bob"
      # ADMIN_GROUPS: "admins"
    volumes:
      # Jobs pygeoapi (jobs.db), cache des descriptions d'algorithmes et
      # planifications (schedules.json) : conservés si le conteneur est recréé.
      - ./api/data:/data
#    labels:
#      traefik.enable: true
#      traefik.http.routers.r_pygeoapi.rule: Host(`ogcapi.exemple.com`)
#      traefik.http.routers.r_ogc_api.entrypoints: websecure
#      traefik.http.routers.r_ogc_api.tls: true
#      traefik.http.routers.r_ogc_api.priority: 10
#      traefik.http.services.s_ogc_api.loadbalancer.server.port: 8000
#      traefik.http.routers.r_ogc_api.service: s_ogc_api
#      traefik.http.routers.r_ogc_api.middlewares: oidc-base@file

    depends_on:
      - qgis-worker

  qgis-worker:
    build: ./worker
    container_name: qgis-worker
    environment:
      QT_QPA_PLATFORM: offscreen
      # "true" : trace les inputs/outputs de tous les jobs (sinon, seuls
      # les jobs en erreur affichent inputs/stdout/stderr).
      WORKER_DEBUG: "false"
      # WORKER_LOG_MAX_CHARS: "5000"
    ports:
      - "8000:8000"
    volumes:
      - ./worker/data:/data
      - ./worker/processing/scripts:/root/.local/share/QGIS/QGIS3/profiles/default/processing/scripts
      - ./worker/processing/models:/root/.local/share/QGIS/QGIS3/profiles/default/processing/models
      - ./worker/QGIS3.ini:/root/.local/share/QGIS/QGIS3/profiles/default/QGIS/QGIS3.ini:ro
